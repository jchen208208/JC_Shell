<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JC_Shell</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      :root {
        --screen-x: 0px;
        --screen-y: 0px;
        --screen-w: 100px;
        --screen-h: 100px;
        --text-x: 0px;
        --text-y: 0px;
        --text-w: 100px;
        --text-h: 100px;
        --bg-x: 0px;
        --bg-y: 0px;
        --bg-w: 100%;
        --bg-h: 100%;
      }
      .frame {
        position: absolute;
        inset: 0;
        -webkit-app-region: drag;
        background-image: url('rotom.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
      }
      #screen {
        position: absolute;
        left: var(--screen-x);
        top: var(--screen-y);
        width: var(--screen-w);
        height: var(--screen-h);
        -webkit-app-region: drag;
        background-image: url('screen-bg.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        isolation: isolate;
      }
      #flash {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: color;
        -webkit-mask-image: url('screen-bg.png');
        -webkit-mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
      }
      #hover {
        position: absolute;
        left: 0;
        top: 0;
        display: none;
        pointer-events: none;
        will-change: transform;
      }
      #hover-sprite {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #hover-aura {
        position: absolute;
        inset: -35%;
        opacity: 0;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, var(--aura, #1fdd4e) 0%, transparent 62%);
      }
      #terminal {
        position: absolute;
        left: var(--text-x);
        top: var(--text-y);
        width: var(--text-w);
        height: var(--text-h);
        -webkit-app-region: no-drag;
      }
      #terminal .xterm-viewport,
      #terminal .xterm-screen,
      #terminal .xterm {
        background-color: transparent !important;
      }
      #terminal .xterm-viewport::-webkit-scrollbar {
        width: 0;
      }
      body[data-mode='fullscreen'] {
        background: #091022 url('full_screen_hologram.png') var(--bg-x) var(--bg-y) / var(--bg-w)
          var(--bg-h) no-repeat;
      }
      body[data-mode='fullscreen'] .frame {
        background-image: none;
      }
      body[data-mode='fullscreen'] #screen {
        display: none;
      }
      body[data-mode='fullscreen'] #hover {
        display: block;
      }
      .btn {
        position: absolute;
        -webkit-app-region: no-drag;
        padding: 0;
        border: none;
        background: transparent;
        cursor: pointer;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <button id="btn-fullscreen" class="btn" title="Fullscreen"></button>
      <button id="btn-close" class="btn" title="Close"></button>
    </div>
    <div id="screen"><div id="flash"></div></div>
    <div id="terminal"></div>
    <div id="hover"><div id="hover-aura"></div><img id="hover-sprite" src="sprites/rotom.gif" alt="" /></div>
    <script src="layout.js"></script>
    <script src="hover.js"></script>
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
