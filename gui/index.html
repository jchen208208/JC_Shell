<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>JC_Shell</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      :root {
        --screen-x: 0px;
        --screen-y: 0px;
        --screen-w: 100px;
        --screen-h: 100px;
        --text-x: 0px;
        --text-y: 0px;
        --text-w: 100px;
        --text-h: 100px;
      }
      .frame {
        position: absolute;
        inset: 0;
        -webkit-app-region: drag;
        background-image: url('rotom.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
        image-rendering: pixelated;
      }
      #screen {
        position: absolute;
        left: var(--screen-x);
        top: var(--screen-y);
        width: var(--screen-w);
        height: var(--screen-h);
        -webkit-app-region: drag;
        background-image: url('screen-bg.png');
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }
      #terminal {
        position: absolute;
        left: var(--text-x);
        top: var(--text-y);
        width: var(--text-w);
        height: var(--text-h);
        -webkit-app-region: no-drag;
      }
      #terminal .xterm-viewport,
      #terminal .xterm-screen,
      #terminal .xterm {
        background-color: transparent !important;
      }
      #terminal .xterm-viewport::-webkit-scrollbar {
        width: 0;
      }
      .btn {
        position: absolute;
        -webkit-app-region: no-drag;
        padding: 0;
        border: none;
        background: transparent;
        cursor: pointer;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <button id="btn-fullscreen" class="btn" title="Fullscreen"></button>
      <button id="btn-close" class="btn" title="Close"></button>
    </div>
    <div id="screen"></div>
    <div id="terminal"></div>
    <script src="layout.js"></script>
    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
